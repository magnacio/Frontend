<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div>
    <h2>Online Registration Form</h2>

    <p>Please fill out the form below to register for our online services.</p>
    <input type="text" placeholder="First Name" required>First Name<br>
    <input type="text" placeholder="Last Name" required>Last Name <br>
    <input type="text" placeholder="id" required>Student ID <br>
    <input type="email" placeholder="Email" required>Email <br>
    <p>Gender:</p>
    <input type="radio" name="gender" value="male" required>Male
    <input type="radio" name="gender" value="female" required>Female <br>
    <input type="checkbox" name="terms" required>Python<br>
    <input type="checkbox" name="terms" required>Java<br>
    <input type="checkbox" name="terms" required>C++<br>
    <input type="checkbox" name="terms" required>JavaScript<br>
    <select name="dropdown" required>
        <option value="">Select a course</option>
        <option value="python">Python</option>
        <option value="java">Java</option>
        <option value="cpp">C++</option>
        <option value="javascript">JavaScript</option>
    </select><br>
    <button type="submit" value="Submit">
    <button type="reset" value="Reset">

    </div>

    
</body>
</html>
