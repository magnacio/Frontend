<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Form</title>
</head>
<body>
 <form method="POST">
    <label for="name">Name:</label>
    <input type="text" id="name" required>
    <label for="age">Age:</label>
    <input type="number" id="age" min="18" max="30" required>
    <label for="email">Email:</label>
    <input type="email" id="email" required>
    <label for="password">Password:</label>
    <input type="password" id="password" required>
    <label for="dob">Date of Birth:</label>
    <input type="date" id="dob" required>
    <label for="gender">Gender:</label> 
    <select id="gender" required>
        <option value="">---Select Gender---</option>
        <option value="male">Male</option>
        <option value="female">Female</option>
    </select>
    <br><br>
    <label for="skills">Skills:</label>
    <input type="checkbox" id="skills" name="skills"> HTML
    <input type="checkbox" id="skills" name="skills"> CSS
    <input type="checkbox" id="skills" name="skills"> JS
    <label for="course">Course:</label>
    <select id="course" required>
        <option value="">---Select Course---</option>
        <option value="frontend">Frontend Development Batch 1</option>
        <option value="backend">Backend Development Batch 1</option>

    </select>
    
    <label for="image">Upload Image:</label>
    <input type="file" id="image" required>
    <input type="submit" value="Submit">
 </form>
</body>
</html>
