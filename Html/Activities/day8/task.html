<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSgrMW4aNzX7PlRPMv4II45O_x0Nj8xoVfivZmEX3yIWw&s=10" alt="SLA Logo" width="50" height="50">
    <title>SLA Admission Page</title>
</head>
<body>
    <header>
    <h1>SLA Admission Page</h1>
    
    </header>
    <form>
        <br>
        <label for="StudentName">Student Name:</label>
        <input type="text" name="StudentName" placeholder="Enter the Name" minlength="10" maxlength="50">
    </br>
    <br>
    <label for="Age">Age:</label>
        <input type="number" name="Age" placeholder="Age" min="18" max="30">
    </br>
    <br>
    <label for="Phone Number">Phone Number:</label>
        <input type="number" name="Phone Number" placeholder="Enter the 10 Digit phone number" minlength="10" maxlength="10">
    </br>
    <br>    
    <label for="Email">Email:</label>
        <input type="email" name="Email" placeholder="Enter the Email">
    </br>
    <br>
    <label for="Address">Address:</label>
        <textarea name="Address" placeholder="Enter the Address" rows="4" cols="50">

        </textarea>
    </br>
    <br>
    <label for="Gender">Gender:</label>
        <input type="radio" name="Gender" value="Male"> Male
        <input type="radio" name="Gender" value="Female"> Female
    </br>
    <br>
    <label for="Qualification">Qualification:</label>
        <input type="text" name="Qualification" placeholder="Enter the Qualification">
    </br>
    <br>
    <label for="Course">Course:</label>
        <select name="Course">
            <option value="">Enter the option</option>
            <option value="FS WITH JAVA">FS WITH JAVA</option>
            <option value="FS WITH PYTHON">FS WITH PYTHON</option>
            <option value="CCNA">CCNA</option>
        </select>
    </br>
    <br>
        <input type="submit" value="Submit">

</br>   



    </form>
</body>
</html>
