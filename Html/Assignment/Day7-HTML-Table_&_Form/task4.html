<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College_Admission_Form</title>
</head>
<body>
    <h1>College Admission Form</h1>
    <form>
        <label for="name">Student Name</label>
        <input type="text" id="name" required>
        <br><br>

        <label for="fathername">Father Name</label>
        <input type="text" id="fathername" required>
        <br><br>

        <label for="mothername">Mother Name</label>
        <input type="text" id="mothername" required>
        <br><br>

        <label for="email">Email</label>
        <input type="email" id="email" required>
        <br><br>

        <label for="phone">Phone</label>
        <input type="tel" id="phone" required>
        <br><br>

        <label for="dob">DOB</label>
        <input type="date" id="dob" required>
        <br><br>

        <label for="gender">Gender</label>
        <select id="gender">
            <option value="select option">--select option--</option>
            <option value="male">male</option>
            <option value="female">female</option>
            <option value="other">other</option>
        </select>
        <br><br>

        <label for="department">Department</label>
        <select id="department">
            <option value="select option">--select option--</option>
            <option value="cse">CSE</option>
            <option value="ece">ECE</option>
            <option value="mech">Mechanical</option>
            <option value="civil">Civil</option>
        </select>
        <br><br>

        <label for="percentage">Percentage</label>
        <input type="number" id="percentage" required min="0" max="100" step="0.01">
        <br><br>

        <label for="address">Address</label>
        <br>
        <textarea id="address" rows="5" cols="30"></textarea>
        <br><br>

        <label for="photo">Passport Size Photo</label>
        <input type="file" id="photo" accept="image/*">
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <br><br>

    <h2>Admission Report</h2>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Application ID</th>
                <th>Student Name</th>
                <th>Department</th>
                <th>Percentage</th>
                <th>Email</th>
                <th>Admission Status</th>
            </tr>
        </thead>
        <tbody>

            </tr>
        </tbody>
    </table>
</body>
</html>
