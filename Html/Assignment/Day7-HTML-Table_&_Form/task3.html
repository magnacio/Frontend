<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient_Registration_Form</title>
</head>
<body>
    <h1>Hospital Patient Registration Form</h1>
    <form>
        <label for="patientid">Patient ID</label>
        <input type="text" id="patientid" required>
        <br><br>

        <label for="name">Patient Name</label>
        <input type="text" id="name" required>
        <br><br>

        <label for="age">Age</label>
        <input type="number" id="age" required min="0" max="120">
        <br><br>

        <label for="gender">Gender</label>
        <select id="gender">
            <option value="select option">--select option--</option>
            <option value="male">male</option>
            <option value="female">female</option>
            <option value="other">other</option>
        </select>
        <br><br>

        <label for="bloodgroup">Blood Group</label>
        <select id="bloodgroup">
            <option value="select option">--select option--</option>
            <option value="a-positive">A+</option>
            <option value="a-negative">A-</option>
            <option value="b-positive">B+</option>
            <option value="b-negative">B-</option>
            <option value="o-positive">O+</option>
            <option value="o-negative">O-</option>
            <option value="ab-positive">AB+</option>
            <option value="ab-negative">AB-</option>
        </select>
        <br><br>

        <label for="doctor">Doctor</label>
        <select id="doctor">
            <option value="select option">--select option--</option>
            <option value="dr-mehta">Dr. Mehta</option>
            <option value="dr-rao">Dr. Rao</option>
            <option value="dr-nair">Dr. Nair</option>
        </select>
        <br><br>

        <label for="appointmentdate">Appointment Date</label>
        <input type="date" id="appointmentdate" required>
        <br><br>

        <label for="symptoms">Symptoms</label>
        <br>
        <textarea id="symptoms" rows="5" cols="30"></textarea>
        <br><br>

        <label for="medicalreport">Medical Report Upload</label>
        <input type="file" id="medicalreport" accept=".pdf,.jpg,.png">
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>

    <br><br>

    <h2>Patient Report</h2>
    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>Patient ID</th>
                <th>Patient Name</th>
                <th>Doctor</th>
                <th>Blood Group</th>
                <th>Appointment Date</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>PAT001</td>
                <td>Suresh Nair</td>
                <td>Dr. Mehta</td>
                <td>O+</td>
                <td>2026-07-25</td>
                <td>Confirmed</td>
            </tr>
            <tr>
                <td>PAT002</td>
                <td>Kavya Iyer</td>
                <td>Dr. Rao</td>
                <td>B+</td>
                <td>2026-07-26</td>
                <td>Pending</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
