<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Showcase</title>
</head>
<body>
    <header>
        <h1>Media Showcase</h1>
    </header>

    <main>
        <section>
            <h2>Images</h2>
            <img src="https://picsum.photos/id/1015/300/200" alt="Mountain river" width="300" height="200">
            <img src="https://picsum.photos/id/1018/300/200" alt="Green valley" width="300" height="200">
            <img src="https://picsum.photos/id/1021/300/200" alt="Forest path" width="300" height="200">
        </section>

        <section>
            <h2>Audio Player</h2>
            <audio controls>
                <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
                Your browser does not support the audio element.
            </audio>
        </section>

        <section>
            <h2>Video Player</h2>
            <video controls width="480" height="270" poster="https://picsum.photos/id/1043/480/270">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4" type="video/mp4">
                <source src="https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.webm" type="video/webm">
                Your browser does not support the video tag.
            </video>
        </section>

        <section>
            <h2>YouTube Video</h2>
            <iframe width="480" height="270"
                src="https://www.youtube.com/embed/M7lc1UVf-VE"
                title="YouTube video player"
                allowfullscreen>
            </iframe>
        </section>

        <section>
            <h2>Google Map</h2>
            <iframe width="480" height="270"
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3888.6!2d77.5946!3d12.9716!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3bae1670c9b44e6d%3A0xf8dfc3e8517e4fe0!2sBangalore%2C%20Karnataka!5e0!3m2!1sen!2sin!4v1690000000000"
                title="Google Map"
                loading="lazy"
                allowfullscreen>
            </iframe>
        </section>

        <section>
            <h2>Embedded PDF</h2>
            <iframe width="480" height="400"
                src="https://pdfobject.com/pdf/sample.pdf"
                title="Embedded PDF document">
            </iframe>
        </section>
    </main>

    <footer>
        <p>&copy; Saswath S</p>
    </footer>
</body>
</html>
