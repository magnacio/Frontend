<!DOCTYPE html>
<html lang="en">
<head>

    <title>Interactive Tags</title>
</head>
<body>
    <a href="https://www.google.com" target="_blank">Clickable Link</a>
    <button onclick="alert('Button clicked!')">Click Me</button>
    <input type="text" placeholder="Enter text">
    <select>
  <option>Java</option>
  <option>Python</option>
  <option>JavaScript</option>
</select>
 <textarea rows="3" placeholder="Write your message here..."></textarea>
 <details>
  <summary>Click to expand</summary>
  <p>Hidden content revealed on click.</p>
</details>
<audio controls src="horse.mp3"></audio>
<video controls width="250" src="movie.mp4"></video>
<form onsubmit="alert('Form submitted!'); return false;">
  <label for="uname">Username:</label>
  <input id="uname" type="text" placeholder="Enter username">
  <button type="submit">Submit</button>
</form>
    
</body>
</html>
