<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration page</title>
</head>
<body>
    <h1>
        Registration page
    </h1>
    <form>
        <br><br>
        <label for="username">username</label>
            <input type="text" id="username" placeholder="Username" required>
     
        <label for="password">password</label>
        <input type="password" id="password" placeholder="Password" required>
        <label for="confirm password">confirm password</label>
        <input type="password" id="confirm_password" placeholder="Confirm Password" required>
        <label for ="email">email</label>
        <input type="email" id="email" placeholder="Email" required>
        <label for="phone">Phone no</label>
        <input type="text" id="phone" placeholder="Phone Number" required>
        <label for="address">address</label>
        <input type="text" id="address" placeholder="Address" required>
        <label for="date">date</label>
        <input type="date" name="dob" placeholder="DD-MM-YYYY">
        <label type="Course">Skills</label>
        <select ID="Course">
            <option value="Select the option">---Select Option---</option>
            <option value="FS WITH JAVA">FS WITH JAVA</option>
            <option value="FS WITH PYTHON">FS WITH PYTHON</option>
        </select>


        <input type="submit">
    </form>
</body>
</html>
