<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 30px;
    }
    .box {
      max-width: 500px;
      margin: 0 auto;
      background: white;
      padding: 20px;
      border: 1px solid #ccc;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px;
      text-align: left;
    }
    button {
      padding: 8px 14px;
      background: crimson;
      color: white;
      border: none;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <div class="box">
    <h2 id="welcome">Welcome</h2>

    <p>Here are all the registered users saved in this browser:</p>

    <table id="userTable">
      <tr>
        <th>Username</th>
        <th>Email</th>
      </tr>
      <!-- rows get added here by JavaScript -->
    </table>

    <button onclick="logout()">Logout</button>
  </div>

  <script src="auth.js"></script>
  <script>
    // run this as soon as the page loads
    loadDashboard();
  </script>

</body>
</html>
