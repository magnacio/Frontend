<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 17 Assignment</title>
<style>
body{font-family:Arial,sans-serif;padding:30px;background:#f5f5f5}
section{background:white;padding:20px;margin-bottom:25px;border-radius:8px}
input,button{padding:8px;margin:5px}
.student-card,.product-card{border:1px solid #ccc;padding:12px;margin-top:10px;border-radius:6px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{border:1px solid #999;padding:10px;text-align:left}
</style>
</head>
<body>

<h1>Day 17 - JavaScript Assignment</h1>

<section>
<h2>Task 1 - Student Details</h2>
<input type="text" id="studentName" placeholder="Name">
<input type="number" id="studentAge" placeholder="Age">
<input type="text" id="studentCity" placeholder="City">
<button id="addStudentBtn">Add Student</button>
<div id="studentDisplay"></div>
</section>

<section>
<h2>Task 2 - Employee Details</h2>
<input type="text" id="employeeName" placeholder="Employee Name">
<input type="text" id="department" placeholder="Department">
<input type="number" id="salary" placeholder="Salary">
<button id="addEmployeeBtn">Add Employee</button>

<table>
<thead>
<tr>
<th>Name</th>
<th>Department</th>
<th>Salary</th>
</tr>
</thead>
<tbody id="employeeTable"></tbody>
</table>
</section>

<section>
<h2>Task 3 - Product Details</h2>
<input type="text" id="productName" placeholder="Product Name">
<input type="number" id="price" placeholder="Price">
<input type="text" id="category" placeholder="Category">
<button id="addProductBtn">Add Product</button>
<div id="productDisplay"></div>
</section>

<script src="script.js"></script>
</body>
</html>
