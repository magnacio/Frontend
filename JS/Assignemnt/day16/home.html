<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript DOM classList Assignment</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 30px;
        }

        section {
            margin-bottom: 40px;
        }

        .box {
            width: 220px;
            padding: 25px;
            background-color: lightgray;
            color: black;
            margin-bottom: 10px;
        }

        .active {
            background-color: blue;
            color: white;
        }

        .card {
            width: 250px;
            padding: 25px;
            background-color: white;
            color: black;
            border: 1px solid gray;
            margin-bottom: 10px;
        }

        .dark {
            background-color: black;
            color: white;
        }

        input {
            padding: 8px;
        }

        button {
            padding: 8px 14px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>JavaScript DOM - classList Assignment</h1>

    <section>
        <h2>Task 1 - Add Class</h2>

        <div id="box1" class="box">
            This is Task 1 Box
        </div>

        <button id="addBtn">Add Active Class</button>
    </section>


    <section>
        <h2>Task 2 - Remove Class</h2>

        <div id="box2" class="box active">
            This box already has active class
        </div>

        <button id="removeBtn">Remove Active Class</button>
    </section>


    <section>
        <h2>Task 3 - Toggle Theme</h2>

        <div id="card" class="card">
            <h3>My Card</h3>
            <p>Click the button to change the theme.</p>
        </div>

        <button id="themeBtn">Toggle Theme</button>
    </section>


    <section>
        <h2>Task 4 - Input Value</h2>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
        >

        <button id="submitBtn">Submit</button>
    </section>


    <script src="script.js"></script>

</body>
</html>
