<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard</title>
    <link rel="stylesheet" href="assets/style2.css">
</head>
<body>
    <main>
<h1>Student Dashboard</h1>
    <div class="container">
        <div class="card">
            <h2>Total Students</h2>
            <p class="value">1,250</p>
            <span>+12% this month</span>
        </div>  
        <div class="card">
            <h2>Trainers</h2>
            <p class="value">24</p>
            <span>Expert mentors</span>
        </div>
        <div class="card">
            <h2>Courses</h2>
            <p class="value">18</p>
            <span>New batches added</span>
        </div>
        <div class="card">
            <h2>Placements</h2>
            <p class="value">320</p>
            <span>Placed this year</span>
        </div>
        <div class="card">
            <h2>Attendance</h2>
            <p class="value">92%</p>
            <span>Average weekly</span>
        </div>
        <div class="card">
            <h2>Fees</h2>
            <p class="value">Rs48K</p>
            <span>Collected this term</span>
        </div>
    </div>
    </main>
</body>
</html>
