<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Grid</title>
    <link rel="stylesheet" href="assets/style3.css">
</head>
<body>
    <main>
<h1>Featured Products</h1>
    <div class="container">
        <div class="card">
            <img src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=600&q=80" alt="Smartphone">
            <h2>Smartphone</h2>
            <p>$599</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?auto=format&fit=crop&w=600&q=80" alt="Sneakers">
            <h2>Sneakers</h2>
            <p>$89</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=600&q=80" alt="Watch">
            <h2>Watch</h2>
            <p>$149</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1583394838336-acd977736f90?auto=format&fit=crop&w=600&q=80" alt="Headphones">
            <h2>Headphones</h2>
            <p>$199</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=600&q=80" alt="Camera">
            <h2>Camera</h2>
            <p>$349</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=600&q=80" alt="Headphones">
            <h2>Earbuds</h2>
            <p>$79</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1517336714731-489689fd1ca8?auto=format&fit=crop&w=600&q=80" alt="Laptop">
            <h2>Laptop</h2>
            <p>$999</p>
        </div>
        <div class="card">
            <img src="https://images.unsplash.com/photo-1491637639811-60e2756cc1c7?auto=format&fit=crop&w=600&q=80" alt="Backpack">
            <h2>Backpack</h2>
            <p>$59</p>
        </div>
    </div>
    </main>
</body>
</html>
