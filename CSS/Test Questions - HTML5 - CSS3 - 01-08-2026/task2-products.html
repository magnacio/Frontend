<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Product Card Layout</title>
<link rel="stylesheet" href="assets/task2-products.css">

    <meta name="viewport" content="width=device-width, initial-scale=1.0"></head>
<body>
    <main>
<div class="product-row">

    <div class="product-card">
      <img src="https://shop.zebronics.com/cdn/shop/files/Zeb-Viper100W-pic1.jpg?v=1784812487&width=2000" alt="Product 1">
      <h3>Wireless Mouse</h3>
      <p>&#8377;799</p>
    </div>

    <div class="product-card">
      <img src="https://keychron.in/wp-content/uploads/2023/02/Keychron-K2-Pro-QMK-VIA-Wireless-Mechanical-Keyboard-for-Mac-Windows-PBT-keycaps-PCB-screw-in-stabilizer-hot-swappable-blue-switch_6c0d9b34-bd4d-4664-89f3-52ed9ec34cd8.jpg" alt="Product 2">
      <h3>Mechanical Keyboard</h3>
      <p>&#8377;2,499</p>
    </div>

    <div class="product-card">
      <img src="https://m.media-amazon.com/images/I/51AXDxd3RqL.jpg" alt="Product 3">
      <h3>USB-C Hub</h3>
      <p>&#8377;1,199</p>
    </div>

    <div class="product-card">
      <img src="https://m.media-amazon.com/images/I/61F20gXJS3L._AC_UF1000,1000_QL80_.jpg" alt="Product 4">
      <h3>Laptop Stand</h3>
      <p>&#8377;999</p>
    </div>

    <div class="product-card">
      <img src="https://m.media-amazon.com/images/I/71eGb1FcyiL._AC_UF1000,1000_QL80_.jpg" alt="Product 5">
      <h3>Webcam HD</h3>
      <p>&#8377;1,799</p>
    </div>

    <div class="product-card">
      <img src="https://m.media-amazon.com/images/I/61Ckk6bdzwL.jpg" alt="Product 6">
      <h3>Desk Lamp</h3>
      <p>&#8377;649</p>
    </div>

  </div>
    </main>
</body>
</html>
